[package]
name = "radb_client"
version = "2.0.0"
edition = "2021"
rust-version = "1.80"
authors = ["Alessandro Crugnola <alessandro.crugnola@gmail.com>"]
description = "adb client for rust"
license = "MIT"
homepage = "https://github.com/sephiroth74/radb_client"
repository = "https://github.com/sephiroth74/radb_client"
exclude = ["test_files/*.apk", "coverage/", "output/"]

[dependencies]
chrono = "0.4.40"
crossbeam-channel = "0.5.14"
file-mode = "0.1.2"
java-properties = "2.0.0"
mac_address = "1.1.8"
regex = "1.11.1"
simple-cmd = "0.0.22"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.12"
tracing = "0.1.41"
uuid = { version = "1.16.0", features = ["v4"] }
which = "8.0.0"

# feature = "clipboard"
arboard = { version = "3.5.0", optional = true }
image = { version = "0.25.6", optional = true, default-features = false, features = ["png"] }

# feature = "scanner"
cidr-utils = { version = "0.7.1", optional = true }
itertools = { version = "0.15.0", optional = true }
threadpool = { version = "1.8.1", optional = true }

[dev-dependencies]
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }

[features]
default = []
# Client::copy_screencap (copies a screenshot to the host clipboard)
clipboard = ["dep:arboard", "dep:image"]
# Scan a network range for adb devices
scanner = ["dep:threadpool", "dep:cidr-utils", "dep:itertools"]
# Builds the `emulator` integration test target (needs a running emulator, see README)
emulator-tests = []

[[test]]
name = "emulator"
path = "tests/emulator/main.rs"
required-features = ["emulator-tests"]

[workspace]
